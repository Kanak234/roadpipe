name: CI

# Validate RoadPipe using its existing offline smoke-test contract.
# The workflow deliberately avoids live OSM/satellite services, so CI remains
# deterministic and does not access external geospatial resources.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # Install the declared runtime stack plus pytest used by repository validation.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      # Parse-only validation catches syntax regressions before execution.
      - name: Validate Python syntax
        run: python -m compileall -q roadpipe test_pipeline.py

      # The repository's smoke test covers the full offline pipeline and asserts
      # graph, resilience, and gatekeeper invariants.
      - name: Run offline smoke tests
        run: python test_pipeline.py
